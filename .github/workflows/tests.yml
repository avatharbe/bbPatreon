name: Tests

on:
  push:
    branches:
      - main
      - develop
      - 'develop-*'
    # Only skipped when every changed file matches, so a commit touching both
    # code and docs still runs the full matrix.
    paths-ignore:
      - '**.md'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'

jobs:
  test:
    uses: phpbb-extensions/test-framework/.github/workflows/tests.yml@3.3.x
    with:
      EXTNAME: 'avathar/bbpatreon'
      PRIMARY_PHP_VERSION: '8.1'
      PHP_VERSION_MATRIX: '["8.1", "8.2", "8.3", "8.4"]'
      RUN_MSSQL_JOBS: 0
